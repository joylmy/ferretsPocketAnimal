name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Google Drive media into public/
        run: |
          npx tsx -e "
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { DEFAULT_DRIVE_FOLDER_ID, parseEmbeddedFolderHtml, resolvePublicDownloadTarget } from './src/utils/driveSync.ts';
          async function crawl(folderId: string, parent = '') {
            const res = await fetch('https://drive.google.com/embeddedfolderview?id=' + encodeURIComponent(folderId) + '#list');
            if (!res.ok) return;
            const entries = parseEmbeddedFolderHtml(await res.text());
            for (const entry of entries) {
              if (entry.kind === 'folder') {
                await crawl(entry.id, parent ? parent + '/' + entry.name : entry.name);
              } else {
                const { finalFileName, downloadUrl } = resolvePublicDownloadTarget(entry);
                const rel = parent ? parent + '/' + finalFileName : finalFileName;
                const dest = path.resolve('public', rel);
                await fs.mkdir(path.dirname(dest), { recursive: true });
                const fileRes = await fetch(downloadUrl, { redirect: 'follow' });
                if (fileRes.ok) {
                  await fs.writeFile(dest, Buffer.from(await fileRes.arrayBuffer()));
                  console.log('Synced to public:', rel);
                }
              }
            }
          }
          crawl(DEFAULT_DRIVE_FOLDER_ID).catch((err) => console.warn('Drive sync warning:', err));
          "

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
